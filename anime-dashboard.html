  @media (max-width: 700px){
    body{ background-attachment: scroll; background-position: center 20%; }
  }
  .wrap{max-width:960px;margin:0 auto;padding:26px 18px 0;}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:6px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1.5px;margin:0;display:flex;align-items:center;gap:10px;line-height:1;}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 2.2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){.dot{animation:none;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .sub{color:var(--text-dim);font-size:12px;font-family:'Space Mono',monospace;}

  .search-box{display:flex;gap:8px;margin-bottom:12px;}
  input[type=text]{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:var(--radius);font-family:'Inter';font-size:14px;outline:none;}
  input[type=text]:focus{border-color:var(--live);}
  button{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:var(--radius);font-family:'Inter';font-weight:600;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s;}
  button:hover{border-color:var(--live);}
  button.primary{background:var(--live);border-color:var(--live);color:#fff;}
  button.primary:hover{background:#ff5876;}
  button.ghost{background:transparent;border:1px solid var(--line);}
  button:disabled{opacity:.4;cursor:default;}
  button.small{padding:5px 9px;font-size:12px;}

  .results{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .result-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;}
  .result-row img{width:38px;height:54px;object-fit:cover;border-radius:5px;flex-shrink:0;}
  .result-meta{flex:1;min-width:0;}
  .result-meta .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .result-meta .aid{font-family:'Space Mono';font-size:10.5px;color:var(--text-dim);}

  section.block{margin-bottom:32px;}

  .upcoming-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}

  .flip{display:flex;gap:4px;}

  .series-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .series-head{display:flex;gap:12px;padding:12px;cursor:pointer;position:relative;}
  .series-head .spine{width:4px;border-radius:4px;flex-shrink:0;}
  .spine.airing{background:var(--live);box-shadow:0 0 8px var(--live);}
  .spine.finished{background:var(--teal);}
  .series-head img.poster{width:52px;height:74px;object-fit:cover;border-radius:6px;flex-shrink:0;}
  .series-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .series-title{font-family:'Bebas Neue';font-size:19px;letter-spacing:0.4px;display:flex;align-items:center;gap:8px;}
  .series-title input{background:transparent;border:none;color:var(--text);font-family:'Bebas Neue';font-size:19px;letter-spacing:0.4px;padding:0;outline:none;border-bottom:1px dashed transparent;width:auto;max-width:220px;}
  .series-title input:focus{border-bottom:1px dashed var(--live);}
  .series-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .badge-new{display:inline-block;background:var(--live-dim);color:var(--live);font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:0.4px;}
  .caret{color:var(--text-dim);font-size:12px;align-self:center;padding:0 4px;transition:transform .15s;}
  .caret.open{transform:rotate(90deg);}
  .remove-series{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-dim);font-size:14px;padding:2px 6px;}
  .remove-series:hover{color:var(--live);}

  .seasons{display:none;border-top:1px solid var(--line);}
  .seasons.open{display:block;}
  .season-row{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-top:1px solid var(--line);}
  .season-row:first-child{border-top:none;}
  .season-label{flex:1;min-width:0;}
  .season-label .name{font-size:13px;font-weight:600;}
  .season-label .name .snum{color:var(--gold);font-family:'Space Mono';margin-right:6px;}
  .progress-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:6px;overflow:hidden;max-width:220px;}
  .progress-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .2s;}
  .stepper{display:flex;align-items:center;gap:7px;flex-shrink:0;}
  .stepper button{padding:3px 8px;font-size:13px;}
  .stepper .n{font-family:'Space Mono';font-weight:700;min-width:20px;text-align:center;font-size:13px;}
  .ep-toggle{background:none;border:1px solid var(--line);color:var(--text-dim);font-size:11px;padding:4px 8px;flex-shrink:0;}
  .ep-toggle:hover{color:var(--text);border-color:var(--live);}
  .episode-list{max-height:340px;overflow-y:auto;border-top:1px solid var(--line);background:rgba(10,9,15,0.35);}
  .episode-row{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 30px;border-top:1px solid var(--line);}
  .episode-row:first-child{border-top:none;}
  .episode-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--teal);flex-shrink:0;cursor:pointer;}
  .episode-row img{width:44px;height:26px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--surface2);}
  .episode-row .etitle{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .episode-row .etitle .en{font-family:'Space Mono';color:var(--gold);margin-right:6px;}
  .episode-row.watched .etitle{color:var(--text-dim);text-decoration:line-through;}
  .ep-loading{padding:10px 14px 10px 30px;color:var(--text-dim);font-size:12px;}

  .empty{color:var(--text-dim);font-size:13.5px;padding:22px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);}
  .loading{color:var(--text-dim);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>SHELF</h1>
    <div class="sub" id="lastSync">—</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cerca un anime da aggiungere…">
    <button class="primary" id="searchBtn">Cerca</button>
  </div>
  <div class="results" id="results"></div>
  <div id="confirmZone"></div>

  <section class="block">
    <h2>In arrivo</h2>
    <div id="upcomingStrip" class="upcoming-strip"><div class="loading">Caricamento…</div></div>
  </section>

  <section class="block">
    <h2>Lo scaffale</h2>
    <div id="shelf" class="shelf"><div class="loading">Caricamento…</div></div>
  </section>
</div>

<script>
const ANILIST_URL = 'https://graphql.anilist.co';
let series = []; // [{seriesId, alias, poster, seasons:[{aniListId, seasonNumber, seasonName, watchedEpisodes:[n,...]}]}]
let mediaCache = {}; // aniListId -> media object (live data)
let openSeries = new Set();

async function anilistQuery(query, variables){
  const res = await fetch(ANILIST_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({query, variables})
  });
  if(!res.ok) throw new Error('AniList request failed: '+res.status);
  const json = await res.json();
  if(json.errors) throw new Error(json.errors[0]?.message || 'AniList error');
  return json.data;
}

function titleOf(m){ return (m.title.english || m.title.romaji || '').trim(); }

async function loadSeries(){
  try{
    const r = await window.storage.get('series', false);
    series = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ series = []; }
}
async function saveSeries(){
  try{ await window.storage.set('series', JSON.stringify(series), false); }
  catch(e){ console.error('Errore salvataggio', e); }
}

/* ---------- SEARCH ---------- */
async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('results');
  document.getElementById('confirmZone').innerHTML = '';
  if(!q){ resultsEl.innerHTML=''; return; }
  resultsEl.innerHTML = '<div class="loading">Cerco su AniList…</div>';
  try{
    const data = await anilistQuery(`
      query ($search:String){
        Page(page:1, perPage:6){
          media(search:$search, type:ANIME, sort:POPULARITY_DESC){
            id title{romaji english} coverImage{medium}
          }
        }
      }`, {search:q});
    const items = data.Page.media;
    if(!items.length){ resultsEl.innerHTML = '<div class="empty">Nessun risultato.</div>'; return; }
    resultsEl.innerHTML = items.map(m=>`
      <div class="result-row">
        <img src="${m.coverImage.medium}" alt="">
        <div class="result-meta">
          <div class="title">${titleOf(m)}</div>
          <div class="aid">AniList ID: ${m.id}</div>
        </div>
        <button data-pick="${m.id}">+ Aggiungi</button>
      </div>`).join('');
    resultsEl.querySelectorAll('[data-pick]').forEach(btn=>{
      btn.addEventListener('click', ()=> openConfirmForRoot(parseInt(btn.getAttribute('data-pick'))));
    });
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">Errore nella ricerca. Riprova.</div>';
  }
}

/* ---------- FRANCHISE / SEASON CHAIN DISCOVERY ---------- */
const MEDIA_WITH_RELATIONS = `
  id title{romaji english} coverImage{large medium} episodes status format
  startDate{year}
  nextAiringEpisode{episode airingAt}
  relations{
    edges{
      relationType
      node{ id title{romaji english} type format episodes status coverImage{large medium} startDate{year} nextAiringEpisode{episode airingAt} }
    }
  }
`;

async function fetchMediaFull(id){
  const data = await anilistQuery(`query($id:Int){ Media(id:$id){ ${MEDIA_WITH_RELATIONS} } }`, {id});
  return data.Media;
}

// BFS following only PREQUEL/SEQUEL edges among TV-like anime, capped.
async function buildFranchiseChain(rootId){
  const visited = new Map(); // id -> node data
  const edges = []; // {from, to} meaning "from is prequel of to"
  const queue = [rootId];
  const seen = new Set([rootId]);
  const CAP = 14;

  while(queue.length && visited.size < CAP){
    const id = queue.shift();
    const node = await fetchMediaFull(id);
    visited.set(id, node);
    for(const edge of node.relations.edges){
      const t = edge.node;
      if(t.type !== 'ANIME') continue;
      if(!['TV','TV_SHORT','ONA'].includes(t.format)) continue;
      if(edge.relationType === 'SEQUEL'){
        edges.push({from:id, to:t.id});
        if(!seen.has(t.id) && visited.size + queue.length < CAP){ seen.add(t.id); queue.push(t.id); }
      } else if(edge.relationType === 'PREQUEL'){
        edges.push({from:t.id, to:id});
        if(!seen.has(t.id) && visited.size + queue.length < CAP){ seen.add(t.id); queue.push(t.id); }
      }
    }
  }

  // Order: find node(s) with no incoming edge among visited, walk forward.
  const incoming = new Set(edges.map(e=>e.to));
  const nextOf = {};
  edges.forEach(e=>{ nextOf[e.from] = e.to; });
  let startId = [...visited.keys()].find(id => !incoming.has(id));
  if(startId === undefined){
    // fallback: sort by startDate year then id
    return [...visited.values()].sort((a,b)=>(a.startDate.year||9999)-(b.startDate.year||9999) || a.id-b.id);
  }
  const ordered = [];
  let cur = startId;
  const guard = new Set();
  while(cur !== undefined && visited.has(cur) && !guard.has(cur)){
    guard.add(cur);
    ordered.push(visited.get(cur));
    cur = nextOf[cur];
  }
  // append any node not reached by the walk (disconnected side entries)
  visited.forEach((node,id)=>{ if(!guard.has(id)) ordered.push(node); });
  return ordered;
}

async function openConfirmForRoot(rootId){
  document.getElementById('results').innerHTML = '';
  document.getElementById('searchInput').value = '';
  const zone = document.getElementById('confirmZone');
  zone.innerHTML = '<div class="loading">Ricostruisco la serie e le stagioni collegate…</div>';
  let chain;
  try{ chain = await buildFranchiseChain(rootId); }
  catch(e){ zone.innerHTML = '<div class="empty">Errore nel recupero delle stagioni.</div>'; return; }

  const seriesAlias = titleOf(chain[0]).replace(/(season|part|cour).*$/i,'').trim() || titleOf(chain[0]);

  zone.innerHTML = `
    <div class="confirm-panel">
      <h3>Conferma la serie</h3>
      <div class="hint">${chain.length>1 ? `Ho trovato ${chain.length} voci collegate su AniList — deseleziona quelle che non vuoi tracciare e sistema i nomi.` : 'Titolo singolo, nessun altra stagione collegata trovata su AniList.'}</div>
      <div class="alias-field">
        <label>Nome serie</label>
        <input type="text" id="seriesAliasInput" value="${seriesAlias.replace(/"/g,'&quot;')}">
      </div>
      <div id="seasonEditList">
        ${chain.map((node,i)=>`
          <div class="season-edit-row" data-node="${node.id}">
            <input type="checkbox" checked data-check="${node.id}">
            <span class="num">S${i+1}</span>
            <input type="text" value="${titleOf(node).replace(/"/g,'&quot;')}" data-name="${node.id}">
            <span class="meta">${node.startDate.year || ''}</span>
          </div>`).join('')}
      </div>
      <div class="confirm-actions">
        <button class="ghost" id="cancelConfirm">Annulla</button>
        <button class="primary" id="saveConfirm">Aggiungi allo scaffale</button>
      </div>
    </div>`;

  document.getElementById('cancelConfirm').addEventListener('click', ()=>{ zone.innerHTML=''; });
  document.getElementById('saveConfirm').addEventListener('click', async ()=>{
    const alias = document.getElementById('seriesAliasInput').value.trim() || seriesAlias;
    const rows = [...zone.querySelectorAll('.season-edit-row')];
    const seasons = [];
    let n = 1;
    rows.forEach(row=>{
      const id = parseInt(row.getAttribute('data-node'));
      const checked = row.querySelector('[data-check]').checked;
      if(!checked) return;
      const name = row.querySelector('[data-name]').value.trim() || ('Stagione '+n);
      seasons.push({ aniListId:id, seasonNumber:n, seasonName:name, watchedEpisodes:[] });
      n++;
    });
    if(!seasons.length){ return; }
    const posterNode = chain.find(c=>c.id===seasons[0].aniListId) || chain[0];
    series.push({
      seriesId: 'sr_'+rootId+'_'+Date.now(),
      alias,
      poster: (posterNode.coverImage.large || posterNode.coverImage.medium),
      seasons
    });
    await saveSeries();
    zone.innerHTML = '';
    openSeries.add(series[series.length-1].seriesId);
    await refreshAndRender();
  });
}

/* ---------- DATA REFRESH ---------- */
async function fetchMediaForAllSeasons(){
  const ids = [...new Set(series.flatMap(s=>s.seasons.map(se=>se.aniListId)))];
  if(!ids.length){ mediaCache = {}; return; }
  const data = await anilistQuery(`
    query($ids:[Int]){
      Page(page:1, perPage:50){
        media(id_in:$ids, type:ANIME){
          id title{romaji english} coverImage{medium large} episodes status
          nextAiringEpisode{episode airingAt}
        }
      }
    }`, {ids});
  mediaCache = {};
  data.Page.media.forEach(m=>{ mediaCache[m.id]=m; });
}

function latestAired(m){
  if(!m) return 0;
  if(m.nextAiringEpisode) return Math.max(0, m.nextAiringEpisode.episode-1);
  if(m.episodes) return m.episodes;
  return 0;
}

function formatCountdown(airingAt){
  const diff = (airingAt*1000)-Date.now();
  if(diff<=0) return null;
  return { d:Math.floor(diff/86400000), h:Math.floor((diff%86400000)/3600000), mi:Math.floor((diff%3600000)/60000) };
}

/* ---------- RENDER ---------- */
function renderUpcoming(){
  const el = document.getElementById('upcomingStrip');
  const items = [];
  series.forEach(s=> s.seasons.forEach(se=>{
    const m = mediaCache[se.aniListId];
    if(m && m.nextAiringEpisode) items.push({s, se, m});
  }));
  items.sort((a,b)=>a.m.nextAiringEpisode.airingAt - b.m.nextAiringEpisode.airingAt);
  const top = items.slice(0,8);
  if(!top.length){ el.innerHTML = '<div class="empty" style="width:100%">Nessun episodio in programma.</div>'; return; }
  el.innerHTML = top.map(({s,se,m})=>{
    const c = formatCountdown(m.nextAiringEpisode.airingAt);
    const cd = c ? `<div class="flip">
        <div class="digitgroup"><div class="digits">${String(c.d).padStart(2,'0')}</div><div class="unit">GG</div></div>
        <div class="digitgroup"><div class="digits">${String(c.h).padStart(2,'0')}</div><div class="unit">ORE</div></div>
        <div class="digitgroup"><div class="digits">${String(c.mi).padStart(2,'0')}</div><div class="unit">MIN</div></div>
      </div>` : '<div class="season-who">in uscita a breve</div>';
    return `<div class="upcoming-card">
      <div class="who">${s.alias}</div>
      <div class="season-who">S${se.seasonNumber} · Ep ${m.nextAiringEpisode.episode}</div>
      ${cd}
    </div>`;
  }).join('');
}

function seriesHasNew(s){
  return s.seasons.some(se=>{
    const m = mediaCache[se.aniListId];
    return m && (se.watchedEpisodes||[]).length < latestAired(m);
  });
}
function seriesIsAiring(s){
  return s.seasons.some(se=> mediaCache[se.aniListId]?.status === 'RELEASING');
}

let openSeasons = new Set(); // aniListId aperti a livello episodio
let episodeCache = {}; // aniListId -> [{num, title, thumb}]

async function fetchEpisodeTitles(aniListId){
  if(episodeCache[aniListId]) return episodeCache[aniListId];
  try{
    const data = await anilistQuery(`
      query($id:Int){ Media(id:$id){ streamingEpisodes{ title thumbnail } } }`, {id:aniListId});
    const eps = (data.Media.streamingEpisodes||[]).map((e,i)=>{
      const match = e.title && e.title.match(/^Episode\s+(\d+)/i);
      return { num: match ? parseInt(match[1]) : i+1, title: e.title || null, thumb: e.thumbnail || null };
    });
    episodeCache[aniListId] = eps;
    return eps;
  }catch(e){
    episodeCache[aniListId] = [];
    return [];
  }
}

function renderShelf(){
  const el = document.getElementById('shelf');
  if(!series.length){ el.innerHTML = '<div class="empty">Lo scaffale è vuoto. Cerca un anime qui sopra per iniziare.</div>'; return; }

  el.innerHTML = series.map(s=>{
    const isOpen = openSeries.has(s.seriesId);
    const airing = seriesIsAiring(s);
    const totalSeasons = s.seasons.length;
    return `<div class="series-card">
      <div class="series-head" data-toggle="${s.seriesId}">
        <button class="remove-series" data-remove-series="${s.seriesId}" title="Rimuovi">✕</button>
        <div class="spine ${airing?'airing':'finished'}"></div>
        <img class="poster" src="${s.poster}" alt="">
        <div class="series-info">
          <div class="series-title">
            <input value="${s.alias.replace(/"/g,'&quot;')}" data-series-alias="${s.seriesId}" onclick="event.stopPropagation()">
            ${seriesHasNew(s) ? '<span class="badge-new">NUOVO</span>' : ''}
          </div>
          <div class="series-sub">${totalSeasons} stagion${totalSeasons===1?'e':'i'} tracciat${totalSeasons===1?'a':'e'}</div>
        </div>
        <div class="caret ${isOpen?'open':''}">▶</div>
      </div>
      <div class="seasons ${isOpen?'open':''}">
        ${s.seasons.map(se=>{
          const m = mediaCache[se.aniListId];
          const latest = latestAired(m);
          const watched = (se.watchedEpisodes||[]).length;
          const pct = latest ? Math.min(100, Math.round((watched/latest)*100)) : 0;
          const seasonOpen = openSeasons.has(se.aniListId);
          return `<div>
            <div class="season-row">
              <div class="season-label">
                <div class="name"><span class="snum">S${se.seasonNumber}</span>${se.seasonName}</div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
              </div>
              <div class="n">${watched}/${latest}</div>
              <button class="ep-toggle" data-ep-toggle="${se.aniListId}">${seasonOpen?'nascondi ep.':'episodi ▾'}</button>
            </div>
            <div class="episode-list-holder" data-holder="${se.aniListId}" style="display:${seasonOpen?'block':'none'}"></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  // popola le liste episodi già aperte (dopo un re-render)
  openSeasons.forEach(id=>{
    const holder = el.querySelector(`[data-holder="${id}"]`);
    if(holder) renderEpisodeList(id, holder);
  });

  el.querySelectorAll('[data-toggle]').forEach(headEl=>headEl.addEventListener('click', (ev)=>{
    if(ev.target.closest('button') || ev.target.tagName==='INPUT') return;
    const id = headEl.getAttribute('data-toggle');
    if(openSeries.has(id)) openSeries.delete(id); else openSeries.add(id);
    renderShelf();
  }));
  el.querySelectorAll('[data-remove-series]').forEach(b=>b.addEventListener('click', async (ev)=>{
    ev.stopPropagation();
    const id = b.getAttribute('data-remove-series');
    if(!confirm('Rimuovere questa serie e tutte le sue stagioni dallo scaffale?')) return;
    series = series.filter(s=>s.seriesId!==id);
    await saveSeries();
    await refreshAndRender();
  }));
  el.querySelectorAll('[data-series-alias]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const id = inp.getAttribute('data-series-alias');
    const s = series.find(s=>s.seriesId===id);
    s.alias = inp.value.trim() || s.alias;
    await saveSeries();
    renderUpcoming();
  }));
  el.querySelectorAll('[data-ep-toggle]').forEach(b=>b.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const id = parseInt(b.getAttribute('data-ep-toggle'));
    if(openSeasons.has(id)) openSeasons.delete(id); else openSeasons.add(id);
    renderShelf();
  }));
}

function findSeasonByAniListId(aniListId){
  for(const s of series) for(const se of s.seasons) if(se.aniListId===aniListId) return {s, se};
  return null;
}

async function renderEpisodeList(aniListId, holder){
  holder.innerHTML = '<div class="ep-loading">Carico titoli episodi…</div>';
  const found = findSeasonByAniListId(aniListId);
  if(!found) return;
  const { se } = found;
  const m = mediaCache[aniListId];
  const latest = latestAired(m);
  const titles = await fetchEpisodeTitles(aniListId);
  const titleByNum = {};
  titles.forEach(t=>{ titleByNum[t.num] = t; });
  const watchedSet = new Set(se.watchedEpisodes||[]);

  let rows = '';
  for(let n=1; n<=latest; n++){
    const t = titleByNum[n];
    const isWatched = watchedSet.has(n);
    rows += `<div class="episode-row ${isWatched?'watched':''}">
      <input type="checkbox" data-ep-check="${aniListId}|${n}" ${isWatched?'checked':''}>
      ${t && t.thumb ? `<img src="${t.thumb}" alt="">` : ''}
      <div class="etitle"><span class="en">Ep ${n}</span>${t && t.title ? t.title.replace(/^Episode\s+\d+\s*-?\s*/i,'') : ''}</div>
    </div>`;
  }
  if(!latest){ holder.innerHTML = '<div class="ep-loading">Nessun episodio ancora uscito.</div>'; return; }
  holder.innerHTML = `<div class="episode-list">${rows}</div>`;

  holder.querySelectorAll('[data-ep-check]').forEach(cb=>cb.addEventListener('change', async ()=>{
    const [aid, num] = cb.getAttribute('data-ep-check').split('|').map(Number);
    const f = findSeasonByAniListId(aid);
    if(!f) return;
    const set = new Set(f.se.watchedEpisodes||[]);
    if(cb.checked) set.add(num); else set.delete(num);
    f.se.watchedEpisodes = [...set].sort((a,b)=>a-b);
    await saveSeries();
    renderShelf();
  }));
}

async function refreshAndRender(){
  try{
    await fetchMediaForAllSeasons();
    renderUpcoming();
    renderShelf();
    document.getElementById('lastSync').textContent = 'sync ' + new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('lastSync').textContent = 'sync non riuscita';
    renderShelf();
  }
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

(async function init(){
  await loadSeries();
  await refreshAndRender();
})();
</script>
</body>
